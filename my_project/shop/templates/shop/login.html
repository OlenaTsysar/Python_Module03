{% extends "base.html" %}

{% block main_content %}
<section class="login">
    <h1>Enter</h1>

    <form method="post">
        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">Enter</button>
    </form>

    {% comment %} <p>
        <a href="{{ url 'shop/register') }}">Register</a>
    </p> {% endcomment %}
</section>
{% endblock main_content%}
